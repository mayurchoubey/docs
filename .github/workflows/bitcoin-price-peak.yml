name: Bitcoin price vs. peak

# Scheduled check that compares Bitcoin's current price against its
# all-time high (peak) and reports the gap as a comment on a tracking issue.
on:
  schedule:
    # Every 6 hours, on the hour (UTC). GitHub may delay scheduled runs under load.
    - cron: "0 */6 * * *"
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  issues: write
  # Lets the keepalive step re-enable this workflow via the API.
  actions: write

# Optional: add a free CoinGecko "demo" API key as a repo secret named
# COINGECKO_API_KEY if scheduled runs start getting HTTP 403 (CoinGecko
# sometimes rate-limits/blocks cloud IPs). The workflow works without it too.

concurrency:
  group: bitcoin-price-peak
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: "📈 Bitcoin price vs. peak tracker"
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - name: Fetch Bitcoin market data
        id: btc
        run: |
          set -euo pipefail

          # CoinGecko returns current price and the all-time high (peak) plus
          # the % change from that peak — no state tracking needed on our side.
          url="https://api.coingecko.com/api/v3/coins/bitcoin?localization=false&tickers=false&market_data=true&community_data=false&developer_data=false&sparkline=false"

          # Headers: a real User-Agent + JSON accept reduce 403s; the demo API
          # key header is only sent when the secret is configured.
          headers=(-H "accept: application/json" -H "User-Agent: github-actions-btc-peak-tracker")
          if [ -n "${COINGECKO_API_KEY:-}" ]; then
            headers+=(-H "x-cg-demo-api-key: ${COINGECKO_API_KEY}")
          fi

          data=""
          for attempt in 1 2 3 4; do
            if data="$(curl -fsSL --max-time 30 "${headers[@]}" "$url")"; then
              break
            fi
            echo "CoinGecko request failed (attempt $attempt), retrying..." >&2
            sleep $((attempt * 3))
          done
          if [ -z "$data" ]; then
            echo "Could not fetch Bitcoin market data after retries." >&2
            exit 1
          fi

          price=$(jq -r '.market_data.current_price.usd' <<<"$data")
          ath=$(jq -r '.market_data.ath.usd' <<<"$data")
          ath_pct=$(jq -r '.market_data.ath_change_percentage.usd' <<<"$data")
          ath_date=$(jq -r '.market_data.ath_date.usd' <<<"$data")

          if [ -z "$price" ] || [ "$price" = "null" ]; then
            echo "Unexpected response from CoinGecko." >&2
            exit 1
          fi

          # Absolute gap from peak (negative when below the peak).
          diff_abs=$(awk -v p="$price" -v a="$ath" 'BEGIN { printf "%.2f", p - a }')
          now=$(date -u +"%Y-%m-%d %H:%M UTC")

          {
            echo "price=$price"
            echo "ath=$ath"
            echo "ath_pct=$ath_pct"
            echo "ath_date=$ath_date"
            echo "diff_abs=$diff_abs"
            echo "now=$now"
          } >> "$GITHUB_OUTPUT"

      - name: Build report
        id: report
        run: |
          set -euo pipefail
          price="${{ steps.btc.outputs.price }}"
          ath="${{ steps.btc.outputs.ath }}"
          ath_pct="${{ steps.btc.outputs.ath_pct }}"
          ath_date="${{ steps.btc.outputs.ath_date }}"
          diff_abs="${{ steps.btc.outputs.diff_abs }}"
          now="${{ steps.btc.outputs.now }}"

          price_fmt=$(printf "%'.2f" "$price")
          ath_fmt=$(printf "%'.2f" "$ath")
          diff_fmt=$(printf "%'.2f" "$diff_abs")
          pct_fmt=$(awk -v p="$ath_pct" 'BEGIN { printf "%.2f", p }')

          {
            echo "**Bitcoin price vs. peak** — $now"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Current price | \$$price_fmt |"
            echo "| All-time peak | \$$ath_fmt (on ${ath_date%T*}) |"
            echo "| Diff from peak | \$$diff_fmt (${pct_fmt}%) |"
            echo ""
            echo "<sub>Source: CoinGecko. Generated by the scheduled \`Bitcoin price vs. peak\` workflow.</sub>"
          } > body.md

          # Expose the report as a multiline step output for later steps.
          {
            echo "body<<EOF"
            cat body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post report to tracking issue
        run: |
          set -euo pipefail

          # Find the existing tracking issue (open) by exact title, or create it.
          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title \
            --jq "map(select(.title == \"$ISSUE_TITLE\")) | .[0].number // empty")"

          if [ -z "$issue_number" ]; then
            issue_number="$(gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --body "This issue collects scheduled reports comparing Bitcoin's price to its all-time peak. Each comment below is one run of the \`Bitcoin price vs. peak\` workflow." \
              | grep -oE '[0-9]+$')"
          fi

          gh issue comment "$issue_number" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file - <<'EOF'
          ${{ steps.report.outputs.body }}
          EOF

      - name: Keep schedule alive
        # GitHub auto-disables scheduled workflows after 60 days without repo
        # activity (this happened on 2026-08-15). Re-enabling the workflow via
        # the API on every run resets that timer, so the schedule survives
        # quiet periods. Runs even if an earlier step failed.
        if: always()
        run: |
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/bitcoin-price-peak.yml/enable"
